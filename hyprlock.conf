general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpaper.jpg
    color = rgb(000000)
    blur_passes = 0
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(e4e4e4)
    font_family = Inter
    font_size = 64
    position = 0, 100
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 46
    position = 0, -40
    halign = center
    valign = center
    outline_thickness = 1
    outer_color = rgb(464646)
    inner_color = rgb(000000)
    font_color = rgb(e4e4e4)
    check_color = rgb(7788af)
    fail_color = rgb(af1d18)
    placeholder_text = Password
    fail_text = Authentication failed
    dots_center = true
    fade_on_empty = false
}
